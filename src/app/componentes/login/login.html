<div class="page-container">
  <div class="surface-card">
    <h2 class="surface-card__title">Iniciar sesión</h2>

    <div class="form-group">
      <label class="form-label" for="mail">Correo electrónico</label>
      <input
        id="mail"
        type="email"
        class="form-control"
        placeholder="tu@correo.com"
        [ngModel]="mail()"
        (ngModelChange)="mail.set($event)"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="clave">Contraseña</label>
      <input
        id="clave"
        type="password"
        class="form-control"
        placeholder="••••••"
        [ngModel]="clave()"
        (ngModelChange)="clave.set($event)"
      />
    </div>

    <div class="form-actions">
      <button class="btn-app btn-primary-app" type="button" (click)="login()">Ingresar</button>
    </div>

    <div class="form-actions">
      <button class="btn-app btn-primary-app" type="button" (click)="accesoRapido(1)">
        Usuario Uno
      </button>
      <button class="btn-app btn-primary-app" type="button" (click)="accesoRapido(2)">
        Usuario Dos
      </button>
      <button class="btn-app btn-primary-app" type="button" (click)="accesoRapido(3)">
        Usuario Tres
      </button>
    </div>

    <p class="form-foot">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
  </div>
</div>

<div class="ahorcado">
  <div class="chabon">
    <svg class="hangman-svg" viewBox="0 0 200 250">
      <line x1="20" y1="240" x2="180" y2="240" />
      <line x1="50" y1="240" x2="50" y2="20" />
      <line x1="50" y1="20" x2="140" y2="20" />
      <line x1="140" y1="20" x2="140" y2="50" />

      @if (errores() >= 1) {
        <circle cx="140" cy="65" r="15" />
      }
      @if (errores() >= 2) {
        <line x1="140" y1="80" x2="140" y2="150" />
      }
      @if (errores() >= 3) {
        <line x1="140" y1="95" x2="110" y2="125" />
      }
      @if (errores() >= 4) {
        <line x1="140" y1="95" x2="170" y2="125" />
      }
      @if (errores() >= 5) {
        <line x1="140" y1="150" x2="110" y2="190" />
      }
      @if (errores() >= 6) {
        <line x1="140" y1="150" x2="170" y2="190" />
      }
    </svg>
  </div>

  <div class="palabra">
    @for (caracter of palabraSeleccionada; track $index) {
      <span>
        {{ letrasUsadas().includes(caracter) ? caracter : '_' }}
      </span>
    }
  </div>

  <div class="letras">
    @for (letra of letras; track letra) {
      <button
        class="letra"
        (click)="apretarLetra(letra)"
        [class.acertada]="letrasUsadas().includes(letra) && palabraSeleccionada.includes(letra)"
        [class.errada]="letrasUsadas().includes(letra) && !palabraSeleccionada.includes(letra)"
        [disabled]="letrasUsadas().includes(letra)"
      >
        {{ letra }}
      </button>
    }
  </div>

  <div class="contador" [class.contador--peligro]="intentosRestantes() <= 2">
    Intentos restantes: {{ intentosRestantes() }} <br />
    Tiempo: {{ tiempo() }} <br />
    Puntaje: {{ puntaje() }}
  </div>

  @if (this.gano() || this.perdio()) {
    <div class="div-terminoJuego">
      <button class="boton-terminoJuego" (click)="jugarDeNuevo()">Jugar de nuevo</button>
    </div>
  }
</div>
